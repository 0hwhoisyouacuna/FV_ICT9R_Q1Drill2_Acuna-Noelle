<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=
    , initial-scale=1.0">
    <title>Q1 Drill 2</title>
    <style>
        body{ 
            background-color: rgb(35, 110, 105);
            font-family: 'Gill Sans', 'Gill Sans MT'
        }
        header{
            text-align: center;
        }
        section{
            background-color: #ffffff;
    	padding: 20px;
    	border-radius: 12px;
    	width: 600px;
    	margin: auto;
    	box-shadow: 0 4px 10px rgba(2, 71, 73, 0.306);
        }
        img{
              display: block;
            margin: 0 auto;
            height: 100px;
            width: 100px;
            padding: 0px;
        }
        input[type="text"], select, textarea, input[type="submit"] {
            width: 94%;
            padding: 15px;
            border: 1px solid #ccc;
            border-radius: 5px;
            text-align: center;
        }
        input[type="placeholder"]{
          text-align: center;
        }
    </style>
</head>
<body>
    <header>
        <h1>RATE A MOVIE</h1>
        <br>
        <p>This form is for you to write your reviews on specific movies.</p>
       </header>

    <br>
        <section>
        <form action="">
        <img src="https://static.vecteezy.com/system/resources/thumbnails/043/858/075/small/movie-director-hand-drawn-organic-line-doodle-png.png" alt="logo/banner"
        <br>
    
  <label for="movie">Movie Title</label>
  <input type="text" id="movie" name="movie" placeholder="Type here..."

  <br>
  <label for="genre">Genre/s</label>
  <br>
  <input type="checkbox" id="genre1" name="Genre1" value="Action">
  <label for="genre1">Action</label>

    <input type="checkbox" id="genre2" name="Genre2" value="Romance">
  <label for="genre2">Romance</label>

    <input type="checkbox" id="genre3" name="Genre3" value="Sci-fi">
  <label for="genre3">Sci-fi</label>

    <input type="checkbox" id="genre4" name="Genre4" value="Comedy">
  <label for="genre4">Comedy</label>

    <input type="checkbox" id="genre5" name="Genre5" value="Fantasy">
  <label for="genre5">Fantasy</label>

  <br>
  <label for="rating">Rating</label>
  <br>
  <input type="radio" id="rate1" name="rate" value="star1">
  <label for="rate1">⭐</label>

   <input type="radio" id="rate2" name="rate" value="star2">
  <label for="rate2">⭐⭐</label>

   <input type="radio" id="rate3" name="rate" value="star3">
  <label for="rate3">⭐⭐⭐</label>

   <input type="radio" id="rate4" name="rate" value="star4">
  <label for="rate4">⭐⭐⭐⭐</label>

   <input type="radio" id="rate5" name="rate" value="star5">
  <label for="rate5">⭐⭐⭐⭐⭐</label>

  <br>
  <textarea id="review" name="review" placeholder="Write a review..." rows="5" cols="40"></textarea>
  <br>

  <input type="submit" id="submit" name="submit" value="Submit Review">
  <br>

  Need movie review tips? Click <a href="https://www.nyfa.edu/student-resources/9-tips-for-writing-a-film-review/" target="_blank">here</a>

    </form>
    </section>

    <!-- Reference
     Nyfa, & Nyfa. (2024, March 23). How to write a movie review: 10 essential tips. NYFA. https://www.nyfa.edu/student-resources/9-tips-for-writing-a-film-review/
</body>
</html>
